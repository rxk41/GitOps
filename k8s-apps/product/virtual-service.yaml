apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: product
  namespace: microservices
spec:
  hosts:
  - "*"
  gateways:
  - microservices-gateway

  http:
  - match:
    - uri:
        prefix: /product
    route:
    - destination:
        host: product
        subset: v1
      weight: 70
    - destination:
        host: product
        subset: v2
      weight: 30
